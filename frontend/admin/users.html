<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="nav"><a class="brand" href="../index.html">CIRS</a><div class="navlinks"><a href="dashboard.html">Dashboard</a><button class="btn btn-secondary" onclick="logout()">Logout</button></div></div><div class="sidebar"><a href="dashboard.html">🏠 Dashboard</a><a href="complaints.html">📋 Complaints</a><a href="users.html">👥 Users</a><a href="officers.html">🧑‍💼 Officers</a></div><main class="main"><div class="container"><h1>Users</h1><div class="card table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th><th>Active</th></tr></thead><tbody id="usersList"></tbody></table></div></div></main><div id="toast" class="toast"></div><script src="../js/api.js"></script><script>if(guard('ADMIN'))(async()=>{const r=await api('/admin/users');usersList.innerHTML=r.data.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td><td>${u.phone||'-'}</td><td>${u.is_active?'Yes':'No'}</td></tr>`).join('')})()</script></body></html>
