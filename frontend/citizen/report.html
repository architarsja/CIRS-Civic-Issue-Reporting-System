<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Issue</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="nav"><a class="brand" href="../index.html">CIRS</a><div class="navlinks"><a href="dashboard.html">Dashboard</a><button class="btn btn-secondary" onclick="logout()">Logout</button></div></div><div class="sidebar"><a href="dashboard.html">🏠 Dashboard</a><a href="report.html">➕ Report Issue</a><a href="complaints.html">📋 My Complaints</a><a href="notifications.html">🔔 Notifications</a><a href="profile.html">👤 Profile</a></div><main class="main"><div class="container"><div class="card form"><h1>Report a civic issue</h1><p class="muted">Provide accurate details so the department can respond quickly.</p><form id="reportForm" enctype="multipart/form-data"><label>Category</label><select name="category" required><option>Roads</option><option>Sanitation</option><option>Water</option><option>Electrical</option><option>Drainage</option><option>Other</option></select><label>Issue title</label><input name="title" required><label>Description</label><textarea name="description" required></textarea><label>Image</label><input name="image" type="file" accept=".jpg,.jpeg,.png,.webp"><label>Location</label><input name="location" placeholder="Area / street"><div class="grid-2"><div><label>Latitude</label><input id="latitude" name="latitude"></div><div><label>Longitude</label><input id="longitude" name="longitude"></div></div><button type="button" class="btn btn-secondary" onclick="getCurrentLocation()">Use Current Location</button><div id="map" class="map" style="margin-top:15px">Map preview appears after location capture.</div><button class="btn btn-primary" style="margin-top:16px">Submit Complaint</button><div id="msg"></div></form></div></div></main><div id="toast" class="toast"></div><script src="../js/api.js"></script><script src="../js/maps.js"></script><script>if(!guard('CITIZEN')){} document.getElementById('reportForm').addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/complaints',{method:'POST',body:new FormData(e.target)});document.getElementById('msg').className='msg success';document.getElementById('msg').textContent='Complaint #'+d.data.id+' submitted successfully.';e.target.reset()}catch(x){document.getElementById('msg').className='msg error';document.getElementById('msg').textContent=x.message}})</script></body></html>
