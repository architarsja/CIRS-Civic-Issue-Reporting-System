<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complaint Details</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="nav"><a class="brand" href="../index.html">CIRS</a><div class="navlinks"><a href="dashboard.html">Dashboard</a><button class="btn btn-secondary" onclick="logout()">Logout</button></div></div><div class="sidebar"><a href="dashboard.html">🏠 Dashboard</a><a href="report.html">➕ Report Issue</a><a href="complaints.html">📋 My Complaints</a><a href="notifications.html">🔔 Notifications</a><a href="profile.html">👤 Profile</a></div><main class="main"><div class="container"><div id="detail"></div></div></main><div id="toast" class="toast"></div><script src="../js/api.js"></script><script>if(guard('CITIZEN'))(async()=>{try{const id=new URLSearchParams(location.search).get('id');const d=(await api('/complaints/'+id)).data;document.getElementById('detail').innerHTML=`<div class="card"><h1>#${d.id} · ${d.title}</h1><p>${d.description}</p><p><b>Category:</b> ${d.category} &nbsp; <span class="badge ${d.status.replaceAll(' ','-')}">${d.status}</span></p><p><b>Location:</b> ${d.location||'Not provided'}</p>${d.image_url?`<img src="${d.image_url}" class="thumb" style="width:240px;height:180px">`:''}<h2>Progress</h2><div class="progress">${['Pending','Assigned','In Progress','Resolved'].map(s=>`<div><div class="step ${s===d.status?'active':''}">✓</div><small>${s}</small></div>`).join('')}</div>${d.resolution_note?`<p><b>Resolution:</b> ${d.resolution_note}</p>`:''}</div>`}catch(e){toast(e.message)}})()</script></body></html>
