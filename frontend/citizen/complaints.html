<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>My Complaints - CIRS</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .complaint-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .complaint-card h3 {
            margin: 0 0 8px;
        }

        .complaint-card p {
            margin: 5px 0;
        }

        .complaint-actions {
            flex-shrink: 0;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<div class="nav">

    <a class="brand" href="../index.html">
        CIRS
    </a>

    <div class="navlinks">

        <a href="dashboard.html">
            Dashboard
        </a>

        <button
            class="btn btn-secondary"
            onclick="logout()">
            Logout
        </button>

    </div>

</div>


<!-- Citizen Sidebar -->
<div class="sidebar">

    <a href="dashboard.html">
        🏠 Dashboard
    </a>

    <a href="report.html">
        ➕ Report Issue
    </a>

    <a href="complaints.html">
        📋 My Complaints
    </a>

    <a href="notifications.html">
        🔔 Notifications
    </a>

    <a href="profile.html">
        👤 Profile
    </a>

</div>


<!-- Main Content -->
<main class="main">

    <div class="container">

        <h1>My Complaints</h1>

        <p class="muted">
            View and track the complaints you have submitted.
        </p>


        <!-- Complaint List -->
        <div id="complaintList">

            <div class="card empty-message">
                <p class="muted">
                    Loading complaints...
                </p>
            </div>

        </div>

    </div>

</main>


<!-- Toast -->
<div id="toast" class="toast"></div>


<!-- Common API JavaScript -->
<script src="../js/api.js"></script>


<!-- Citizen JavaScript -->
<script src="../js/citizen.js"></script>


<!-- Load Citizen Complaints -->
<script>

    loadCitizen();

</script>


</body>
</html>
