<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="nav"><a class="brand" href="../index.html">CIRS</a><div class="navlinks"><a href="dashboard.html">Dashboard</a><button class="btn btn-secondary" onclick="logout()">Logout</button></div></div><div class="sidebar"><a href="dashboard.html">🏠 Dashboard</a><a href="report.html">➕ Report Issue</a><a href="complaints.html">📋 My Complaints</a><a href="notifications.html">🔔 Notifications</a><a href="profile.html">👤 Profile</a></div><main class="main"><div class="container"><div class="card form"><h1>My Profile</h1><form id="profile"><label>Name</label><input id="name"><label>Phone</label><input id="phone"><label>Address</label><textarea id="address"></textarea><button class="btn btn-primary">Save changes</button><div id="msg"></div></form></div></div></main><div id="toast" class="toast"></div><script src="../js/api.js"></script><script>if(guard('CITIZEN')){const u=user();name.value=u.name;phone.value=u.phone||'';address.value=u.address||''}profile.addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/auth/profile',{method:'PUT',body:JSON.stringify({name:name.value,phone:phone.value,address:address.value})});localStorage.setItem('cirs_user',JSON.stringify({...user(),...d.data}));msg.className='msg success';msg.textContent='Profile updated'}catch(x){msg.className='msg error';msg.textContent=x.message}})</script></body></html>
